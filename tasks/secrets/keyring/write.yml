---
# Write secret to Linux Secret Service (GNOME Keyring) using secret-tool.
# No native Ansible module exists - command module exception approved.
# Required variables:
#   - secret_key: Attribute value used to identify the secret (e.g., "lan.homelab/prd/cert-name").
#   - secret_value: The password/secret to store.
# Behavior:
#   - Stores or overwrites the entry identified by the password attribute.
#   - Label is set to secret_key for human-readable display in keyring managers.
#   - Password is passed via stdin to avoid process-list exposure.
#   - Fails on any error (locked keyring, permission denied, etc.).

- name: "Writing secret to Linux Keyring with key '{{ secret_key }}'"
  no_log: "{{ not debug | default(true) }}"
  ansible.builtin.command:
    argv:
      - "secret-tool"
      - "store"
      - "--label={{ secret_key }}"
      - "password"
      - "{{ secret_key }}"
  args:
    stdin: "{{ secret_value }}"
    stdin_add_newline: false
  register: "secret_write_result"
  changed_when: secret_write_result.rc == 0
  failed_when: secret_write_result.rc != 0
