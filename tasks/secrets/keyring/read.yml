---
# Read secret from Linux Secret Service (GNOME Keyring) using secret-tool.
# No native Ansible module exists - command module exception approved.
# Required variables:
#   - secret_key: Attribute value used to look up the secret (e.g., "lan.homelab/prd/cert-name").
# Returns:
#   - secret_value: The retrieved password/secret.
# Behavior:
#   - Searches the default keyring by attribute key/value pair.
#   - Fails if secret is not found or keyring is locked/unavailable.
#   - Returns only the password value (no metadata).

- name: "Reading secret from Linux Keyring with key '{{ secret_key }}'"
  no_log: "{{ not debug | default(true) }}"
  ansible.builtin.command: "secret-tool lookup password {{ secret_key }}"
  register: "secret_read_result"
  failed_when: secret_read_result.rc != 0
  changed_when: false

- name: "Setting secret value from Keyring response in variable 'secret_value'"
  no_log: "{{ not debug | default(true) }}"
  ansible.builtin.set_fact:
    secret_value: "{{ secret_read_result.stdout | trim }}"
