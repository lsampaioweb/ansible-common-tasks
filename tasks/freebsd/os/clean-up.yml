---
- name: "Searching for log and temp files that can be removed"
  ansible.builtin.find:
    paths:
      - "/var/log"
      - "/var/tmp"
      - "/tmp"
    patterns: "*.gz,*.log.*"
    recurse: true
  register: "temp_files_to_delete"

- name: "Removing unnecessary files"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: "absent"
  loop: "{{ temp_files_to_delete.files | default([]) }}"
  loop_control:
    index_var: "index"
    label: "{{ index }} - {{ item.path }}"

- name: "Searching for log and temp files whose contents can be truncated"
  ansible.builtin.find:
    paths:
      - "/var/log"
      - "/var/tmp"
      - "/tmp"
    patterns: "*.log"
    recurse: true
  register: "temp_files_to_truncate"

- name: "Truncating the log files"
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: "(?s).*"
    replace: ""
  register: "truncate_files_result"
  loop: "{{ temp_files_to_truncate.files | default([]) }}"
  loop_control:
    index_var: "index"
    label: "{{ index }} - {{ item.path }}"
