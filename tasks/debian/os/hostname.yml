---
- name: "Setting the hostname of the server"
  when:
    - hostname is defined
  block:
    - name: "Setting system hostname"
      ansible.builtin.hostname:
        name: "{{ hostname }}{{ ('.' + domain) if domain is defined else '' }}"

    - name: "Setting the hostname in the /etc/hosts"
      ansible.builtin.lineinfile:
        path: "/etc/hosts"
        regexp: "^127\\.0\\.1\\.1.*"
        line: "127.0.1.1      {{ hostname }}{{ ('.' + domain) if domain is defined else '' }}  {{ hostname }}"
        owner: "root"
        group: "root"
        mode: "0644"
