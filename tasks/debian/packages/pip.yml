---
- name: "Ensuring the pip package is installed"
  ansible.builtin.pip:
    name: "pip"
    state: "present"

- name: "Installing Python packages"
  ansible.builtin.pip:
    name: "{{ item.name }}"
    state: "{{ item.state | default(omit) }}"
  loop: "{{ packages | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: "pip_installation_result"
