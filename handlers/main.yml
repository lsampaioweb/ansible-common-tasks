---
- name: "Applying sysctl configuration"
  # No native Ansible module exists for sysctl --system (full reload).
  ansible.builtin.command: "/sbin/sysctl --system"
  register: "sysctl_result"
  changed_when: sysctl_result.rc == 0

- name: "Updating Grub"
  # No native Ansible module exists for update-grub.
  ansible.builtin.command: "update-grub"
  register: "grub_result"
  changed_when: grub_result.rc == 0

- name: "Reconfiguring Timezone"
  # No native Ansible module exists for dpkg-reconfigure tzdata.
  ansible.builtin.command: "dpkg-reconfigure --frontend noninteractive tzdata"
  register: "tz_result"
  changed_when: tz_result.rc == 0

- name: "Restarting Timesyncd"
  ansible.builtin.systemd:
    name: "systemd-timesyncd"
    state: "restarted"

- name: "Restarting Chronyd"
  ansible.builtin.systemd:
    name: "chronyd"
    state: "restarted"

- name: "Restarting Systemd-Resolved"
  ansible.builtin.systemd:
    name: "systemd-resolved"
    state: "restarted"

- name: "Restarting Xrdp"
  ansible.builtin.systemd:
    name: "xrdp"
    state: "restarted"
    enabled: true

- name: "Restarting Bind9"
  ansible.builtin.systemd:
    name: "bind9"
    state: "restarted"
    enabled: true

- name: "Restarting Chrony"
  ansible.builtin.systemd:
    name: "chrony"
    state: "restarted"
    enabled: true

- name: "Enabling Packer autocomplete"
  become: false
  # No native Ansible module exists for packer autocomplete installation.
  ansible.builtin.command: "packer -autocomplete-install"
  register: "autocomplete_output"
  failed_when:
    - autocomplete_output.rc != 0
    - "'already installed' not in autocomplete_output.stderr"
  changed_when:
    - autocomplete_output.rc == 0

- name: "Enabling Terraform autocomplete"
  become: false
  # No native Ansible module exists for terraform autocomplete installation.
  ansible.builtin.command: "terraform -install-autocomplete"
  register: "autocomplete_output"
  failed_when:
    - autocomplete_output.rc != 0
    - "'already installed' not in autocomplete_output.stderr"
  changed_when:
    - autocomplete_output.rc == 0

- name: "Rebooting host"
  ansible.builtin.reboot:
    msg: "Reboot initiated by Ansible"
    connect_timeout: 5
    reboot_timeout: 120
    pre_reboot_delay: 0
    post_reboot_delay: 10
    test_command: "whoami"

- name: "Restarting network"
  ansible.builtin.systemd:
    name: "networking"
    state: "restarted"
  poll: 0
  async: 60

- name: "Restarting NetworkManager"
  ansible.builtin.systemd:
    name: "NetworkManager"
    state: "restarted"
  poll: 0
  async: 60

- name: "Reloading network"
  # No native Ansible module exists for ifreload.
  ansible.builtin.command: "ifreload -a"
  register: "reload_result"
  changed_when: reload_result.rc == 0

- name: "Waiting for the network device to reload"
  ansible.builtin.wait_for_connection:
    delay: 1

- name: "Updating the CA list - Debian"
  # No native Ansible module exists for update-ca-certificates.
  ansible.builtin.command: "update-ca-certificates"
  register: "ca_list_result"
  changed_when: ca_list_result.rc == 0

- name: "Updating CA Certificates FreeBSD"
  # No native Ansible module exists for certctl rehash.
  ansible.builtin.command: "certctl rehash"
  register: "ca_update_result"
  changed_when: ca_update_result.rc == 0

- name: "Restarting and Enabling fail2ban"
  ansible.builtin.systemd:
    name: "fail2ban"
    state: "restarted"
    enabled: true

- name: "Restarting the SSH server"
  ansible.builtin.systemd:
    name: "ssh"
    state: "restarted"
    enabled: true
  failed_when: false

- name: "Restarting and Enabling docker"
  ansible.builtin.systemd:
    name: "docker"
    state: "restarted"
    enabled: true

- name: "Refreshing ~/.bashrc"
  become: false
  # No native Ansible module exists to source a shell init file.
  ansible.builtin.shell: >-
    set -o pipefail && \
    source ~/.bashrc
  args:
    executable: "/usr/bin/bash"
  register: "source_output"
  changed_when: source_output.rc == 0

- name: "Restarting and Enabling keepalived"
  ansible.builtin.systemd:
    name: "keepalived"
    state: "restarted"
    enabled: true

- name: "Restarting qemu-guest-agent"
  ansible.builtin.systemd:
    name: "qemu-guest-agent"
    state: "started"
    enabled: true

- name: "Applying Netplan"
  # No native Ansible module exists for netplan apply.
  ansible.builtin.command: "netplan apply"
  poll: 1
  async: 60
  register: "netplan_result"
  changed_when: netplan_result.rc == 0

- name: "Starting gnome-keyring-daemon"
  # No native Ansible module exists for gnome-keyring-daemon.
  ansible.builtin.command: "gnome-keyring-daemon --start --components=secrets,ssh"
  register: "keyring_result"
  changed_when: keyring_result.rc == 0
